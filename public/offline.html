<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دكان — بدون اتصال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      text-align: center;
      padding: 24px;
      direction: rtl;
    }
    .card {
      max-width: 360px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #E9E2D6;
      box-shadow: 0 1px 2px rgba(28,26,23,.05), 0 4px 10px rgba(28,26,23,.05);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: #7A7268;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .retry-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #E2871E;
      color: #1C1A17;
      font-weight: 700;
      font-size: 0.8125rem;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .retry-btn:hover { filter: brightness(0.96); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصال الشبكة ثم أعد المحاولة. الطلبات الجديدة لن تصل حتى يعود الاتصال.</p>
    <button class="retry-btn" onclick="window.location.reload()">أعد المحاولة</button>
  </div>
  <script>
    // Auto-retry when the browser comes back online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
